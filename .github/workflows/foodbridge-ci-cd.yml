name: FoodBridge API - CI e deploy Oracle

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preflight:
        description: 'Apenas verificar SSH/serviço Oracle; não publica nem reinicia'
        required: true
        type: boolean
        default: false
      deploy:
        description: 'Publicar na Oracle Cloud apos CI (requer configuracao e secrets)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: foodbridge-api-${{ github.ref }}
  # Não interromper um deploy entre troca do JAR, restart e rollback.
  cancel-in-progress: false

jobs:
  build-e-testes:
    name: Compilar e testar Kotlin / Java 21
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: foodbridge_ci
          POSTGRES_USER: foodbridge_ci
          POSTGRES_PASSWORD: senha_apenas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodbridge_ci -d foodbridge_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/foodbridge_ci
      SPRING_DATASOURCE_USERNAME: foodbridge_ci
      SPRING_DATASOURCE_PASSWORD: senha_apenas_ci
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      SPRING_JPA_SHOW_SQL: 'false'
      JWT_SECRET: chave_para_testes_ci_somente_nao_utilizar_em_producao_2026
      JWT_EXPIRATION: '86400000'
      APP_ADMIN_EMAIL: admin-ci@example.test
      APP_ADMIN_PASSWORD: senha_ci_descartavel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle com cache e validacao de wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar, testar e gerar o JAR
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace clean test bootJar
          test -s build/libs/foodbridge-0.0.1-SNAPSHOT.jar

      - name: Diagnostico isolado do teste de perfil ao falhar
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          for p in Path('build/test-results/test').glob('*SchemaValidationContextTest*.xml'):
              root = ET.parse(p).getroot()
              for case in root.findall('.//testcase'):
                  for failure in case.findall('failure'):
                      print('CONTEXT TEST:', case.get('name'))
                      print('ERROR TYPE:', failure.get('type'))
                      trace = (failure.text or '').splitlines()
                      # A role/datasource do teste são dados sintéticos; nunca imprimir configurações.
                      print('\n'.join(trace[:18]))
          PY
      - name: Validar contrato de SSH, rollback e scripts (sem tocar na Oracle)
        shell: bash
        run: |
          bash -n deploy/oracle/preparar-vm.sh
          bash -n deploy/oracle/atualizar-api.sh
          bash -n deploy/oracle/verificar-vm.sh
          bash -n deploy/oracle/pull-approved-artifact.sh
          python3 -m unittest discover -s tests/ci -p 'test_*_contract.py' -v

      - name: Publicar relatorios de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foodbridge-relatorios
          path: |
            build/reports/tests/
            build/test-results/test/
          if-no-files-found: ignore
          retention-days: 7

      - name: Guardar JAR aprovado
        uses: actions/upload-artifact@v4
        with:
          name: foodbridge-api-jar
          path: build/libs/foodbridge-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7


  verificar-oracle:
    name: Preflight Oracle somente leitura (sem deploy)
    needs: [build-e-testes]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.preflight == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: oracle-production
    env:
      OCI_SSH_HOST: ${{ vars.OCI_SSH_HOST }}
      OCI_SSH_USER: ${{ vars.OCI_SSH_USER }}
      OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      OCI_SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
    steps:
      - name: Checkout de verificações sem modificar a VM
        uses: actions/checkout@v4
      - name: Validar secrets e preparar SSH com host key fixada
        shell: bash
        run: |
          set -euo pipefail
          for nome in OCI_SSH_HOST OCI_SSH_USER OCI_SSH_PRIVATE_KEY OCI_SSH_KNOWN_HOSTS; do
            if [[ -z "${!nome:-}" ]]; then
              echo "::error::Falta ${nome}; confira docs/DEPLOY_ORACLE.md"
              exit 1
            fi
          done
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > "$HOME/.ssh/foodbridge_deploy"
          printf '%s\n' "$OCI_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/foodbridge_deploy" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/foodbridge_deploy" > /dev/null
      - name: Verificar VM em modo somente leitura
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS=(-i "$HOME/.ssh/foodbridge_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=10)
          ssh "${SSH_OPTS[@]}" "${OCI_SSH_USER}@${OCI_SSH_HOST}" 'bash -s' < deploy/oracle/verificar-vm.sh
      - name: Apagar chave temporária
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/foodbridge_deploy"

  deploy-oracle:
    name: Publicar na VM Oracle
    needs: [build-e-testes]
    # Publicação manual durante homologação; push na main executa somente CI.
    if: github.ref == 'refs/heads/main' && vars.OCI_DEPLOY_ENABLED == 'true' && !inputs.preflight && github.event_name == 'workflow_dispatch' && inputs.deploy == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: oracle-production
    env:
      OCI_SSH_HOST: ${{ vars.OCI_SSH_HOST }}
      OCI_SSH_USER: ${{ vars.OCI_SSH_USER }}
      OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      OCI_SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
    steps:
      - name: Checkout do script de deploy
        uses: actions/checkout@v4

      - name: Recuperar o mesmo JAR aprovado pelo CI
        uses: actions/download-artifact@v4
        with:
          name: foodbridge-api-jar
          path: pacote/

      - name: Verificar configuracao e preparar SSH
        shell: bash
        run: |
          set -euo pipefail
          for nome in OCI_SSH_HOST OCI_SSH_USER OCI_SSH_PRIVATE_KEY OCI_SSH_KNOWN_HOSTS; do
            if [[ -z "${!nome:-}" ]]; then
              echo "::error::Configuracao ausente: ${nome}. Consulte docs/DEPLOY_ORACLE.md"
              exit 1
            fi
          done
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > "$HOME/.ssh/foodbridge_deploy"
          printf '%s\n' "$OCI_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/foodbridge_deploy" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/foodbridge_deploy" > /dev/null
          test -s pacote/foodbridge-0.0.1-SNAPSHOT.jar

      - name: Pré-flight obrigatório sem escrita antes do deploy
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS=(-i "$HOME/.ssh/foodbridge_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=10)
          ssh "${SSH_OPTS[@]}" "${OCI_SSH_USER}@${OCI_SSH_HOST}" 'bash -s' < deploy/oracle/verificar-vm.sh
      - name: Transferir JAR e aplicar com rollback
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS=(-i "$HOME/.ssh/foodbridge_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=10)
          REMOTO="${OCI_SSH_USER}@${OCI_SSH_HOST}"
          JAR="pacote/foodbridge-0.0.1-SNAPSHOT.jar"
          SOMA="$(sha256sum "$JAR" | cut -d' ' -f1)"
          DESTINO_TEMP="$(ssh "${SSH_OPTS[@]}" "$REMOTO" 'mktemp /tmp/foodbridge-deploy.XXXXXXXX.jar')"
          scp "${SSH_OPTS[@]}" "$JAR" "$REMOTO:$DESTINO_TEMP"
          ssh "${SSH_OPTS[@]}" "$REMOTO" "bash -s -- '$SOMA' '$DESTINO_TEMP'" < deploy/oracle/atualizar-api.sh

      - name: Remover chave temporaria
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/foodbridge_deploy"
