name: Oracle - incidente startup API (somente leitura)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-api-incident.yml'
      - 'deploy/oracle/diagnosticar-falha-startup.sh'
permissions:
  contents: read
concurrency:
  group: oracle-api-incident-readonly
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: oracle-production
    env:
      SSH_HOST: ${{ vars.OCI_SSH_HOST }}
      SSH_USER: ${{ vars.OCI_SSH_USER }}
      SSH_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
    steps:
      - name: Checkout para apenas diagnosticar
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validar sintaxe bash
        shell: bash
        run: bash -n deploy/oracle/diagnosticar-falha-startup.sh
      - name: Preparar chave RSA aprovada e host key fixa
        shell: bash
        run: |
          set -euo pipefail
          for v in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS; do
            [[ -n "${!v:-}" ]] || { echo "::error::Falta $v no environment"; exit 1; }
          done
          umask 077
          install -d -m 0700 "$RUNNER_TEMP/foodbridge-incident"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/foodbridge-incident/id_rsa"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/foodbridge-incident/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/foodbridge-incident/id_rsa" -P '' > "$RUNNER_TEMP/foodbridge-incident/id_rsa.pub"
          fp="$(ssh-keygen -lf "$RUNNER_TEMP/foodbridge-incident/id_rsa.pub" -E sha256 | awk '{print $2}')"
          [[ "$fp" == 'SHA256:3zV6jlZeYgt19xz4h0KrumznEr3SNlyAEiolj+XrmO8' ]] || { echo '::error::RSA inesperada'; exit 1; }
      - name: Ler estado VM e resumir falhas sem imprimir logs sensiveis
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS=(-i "$RUNNER_TEMP/foodbridge-incident/id_rsa"
            -o IdentityAgent=none -o IdentitiesOnly=yes -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/foodbridge-incident/known_hosts"
            -o ConnectTimeout=15)
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" 'bash -s' < deploy/oracle/diagnosticar-falha-startup.sh
      - name: Remover chave de trabalho
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/foodbridge-incident/id_rsa" "$RUNNER_TEMP/foodbridge-incident/id_rsa.pub" "$RUNNER_TEMP/foodbridge-incident/known_hosts"
